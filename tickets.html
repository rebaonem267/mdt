<style>

/* =========================================================
ROOT VARIABLES
========================================================= */

:root{

  --gold:#d4a017;
  --gold-light:#f4c542;

  --dark:#050505;
  --dark2:#0d0d0d;
  --dark3:#141414;

  --white:#ffffff;
  --gray:#c0c0c0;

}

/* =========================================================
GLOBAL RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  background:black;

  color:white;

  font-family:'Poppins',sans-serif;

  overflow-x:hidden;

img{
  max-width:100%;
  display:block;
}

section{
  padding:120px 8%;

}

h1,h2,h3,h4{

}

/* =========================================================
NAVIGATION BAR
========================================================= */

nav{

  position:fixed;

  top:0;
  left:0;

  width:100%;

  padding:22px 8%;

  display:flex;

  justify-content:space-between;
  align-items:center;

  z-index:999;

  background:rgba(0,0,0,0.45);

  backdrop-filter:blur(10px);

  border-bottom:1px solid rgba(255,255,255,0.05);

}

/* =========================================================
LOGO
========================================================= */

.logo{

  display:flex;

  align-items:center;

  text-decoration:none;

}

.logo img{

  width:180px;

  max-width:100%;

  height:auto;

  object-fit:contain;

  background:transparent;

  mix-blend-mode:screen;

}

/* =========================================================
NAV LINKS
========================================================= */

nav ul{

  display:flex;

  align-items:center;

  list-style:none;

  gap:40px;

  flex-wrap:wrap;

}

nav ul li a{

  text-decoration:none;

  color:white;

  font-size:15px;

  letter-spacing:2px;

  text-transform:uppercase;

  transition:0.3s;

  position:relative;

}

nav ul li a:hover{
  color:var(--gold);
}

/* =========================================================
HAMBURGER MENU
========================================================= */

.hamburger{

  display:none;

  flex-direction:column;

  gap:5px;

  cursor:pointer;

}

.hamburger span{

  width:25px;
  height:2px;

  background:white;

}

/* =========================================================
BUTTONS
========================================================= */

.btn{

  padding:18px 40px;

  border-radius:60px;

  border:none;

  cursor:pointer;

  font-weight:600;

  transition:0.4s;

  text-decoration:none;

  font-size:15px;

}

.gold-btn{

  background:var(--gold);

  color:black;

}

.gold-btn:hover{

  background:var(--gold-light);

  transform:translateY(-4px);

}

/* =========================================================
SECTION TITLES
========================================================= */

.section-title{

  text-align:center;

  margin-bottom:70px;

}

.section-title small{

  display:block;

  color:var(--gold);

  letter-spacing:5px;

  text-transform:uppercase;

  margin-bottom:20px;

}

.section-title h2{

  font-size:clamp(2.5rem,7vw,5rem);

  line-height:1.1;

}

/* =========================================================
TICKETS PAGE HEADER
========================================================= */

.tickets-page-header{

  padding-top:180px;

  padding-bottom:0;

  text-align:center;

}

.back-link{

  display:inline-flex;

  align-items:center;

  gap:8px;

  color:var(--gray);

  text-decoration:none;

  font-size:0.9rem;

  letter-spacing:1px;

  text-transform:uppercase;

  margin-bottom:30px;

}

.back-link:hover{

}

/* =========================================================
TICKETS / NO SALE STATE
========================================================= */

#ticketsContainer{

  display:flex;

  justify-content:center;

}

.no-shows{

  text-align:center;

  padding:80px 30px;

  border-radius:30px;

  width:100%;

  max-width:700px;

}

.no-shows h3{

  margin-bottom:18px;

  text-transform:uppercase;

  letter-spacing:3px;

}

.no-shows p{

  font-size:1.05rem;

}

/* =========================================================
TICKETS PAGE
========================================================= */

.ticket-page{

  width:100%;

  max-width:960px;

}

.ticket-event-head{

  text-align:center;

  margin-bottom:50px;

}

.ticket-event-head .label{

  color:var(--gold);

  letter-spacing:5px;

}

.ticket-event-head h3{

}

.ticket-event-head p{

  line-height:1.7;

}

.ticket-layout{

}

.ticket-panel{

.ticket-panel h4{

}

.ticket-type{

  gap:20px;

}

.ticket-type.selected{

.ticket-type-info h5{

}

.ticket-type-info span{

  font-size:0.9rem;

}

.ticket-type-price{

  color:var(--gold);

  font-size:1.3rem;

  white-space:nowrap;

}

.date-pill-list{

  display:flex;

  flex-wrap:wrap;

  gap:12px;

  margin-bottom:32px;

}

.date-pill{

  padding:14px 20px;

  border:1px solid rgba(255,255,255,0.12);

  border-radius:14px;

  background:transparent;

  color:white;

  font-family:'Poppins',sans-serif;

}

.date-pill span{

}

.date-pill .date-pill-weekday{

  color:var(--gray);

  font-size:0.7rem;

  letter-spacing:1px;

  text-transform:uppercase;

}

.date-pill:hover{

  border-color:rgba(212,160,23,0.5);

}

.date-pill.selected{

  color:var(--gold);

}

.date-pill.selected .date-pill-weekday{

}

}

.qty-stepper button{

}

.qty-stepper button:hover{

}

.qty-stepper span{

  min-width:30px;

  font-family:'Oswald',sans-serif;

}

.ticket-summary-row{

  display:flex;

  justify-content:space-between;

  padding:14px 0;

  border-bottom:1px solid rgba(255,255,255,0.08);

  color:var(--gray);

}

.ticket-summary-row.total{

  font-size:1.3rem;

  font-family:'Oswald',sans-serif;

  border-bottom:none;

  padding-top:20px;

}

.ticket-summary-row.total span:last-child{

  color:var(--gold);

}

.payment-methods{

  margin-top:30px;

  display:flex;

  flex-direction:column;

  gap:14px;

}

.pay-btn{

  width:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

  padding:18px;

  border:1px solid rgba(255,255,255,0.15);

  background:#1a1a1a;

  color:white;

  font-size:15px;

  cursor:pointer;

}

.pay-btn:hover{

}

.pay-btn:disabled{

}

.pay-btn:disabled:hover{

}

.pay-btn .pay-logo{

  letter-spacing:0.5px;

}

.form-status{

  min-height:22px;

  margin-top:16px;

  font-size:0.9rem;

}

.form-status.success{
  color:var(--gold);
}

.form-status.error{

}

.ticket-note{

  margin-top:18px;

.social-links a{

.social-icon{

  }

  }

}

<script>

/* =========================================================
UPCOMING EVENTS DATA
=========================================================
This is the same array that lives in index.html. It is
duplicated here because each HTML file is a separate static
page. If you add/change a show, update it in BOTH files.
========================================================= */

let events = [

  {

    title: "CHABA",

    subtitle: "Mophato Dance Theatre's 15th Anniversary Celebration & the launch of Mophato's book, \u201cBotswana's Story, Told in Dance.\u201d",

    venue: "Civic Center Hall, Main Mall",

    showDates: [
      "2026-09-01",
      "2026-09-02",
      "2026-09-03",
      "2026-09-05"
    ],

    startDateTime: "2026-09-01T18:00:00",

    endDateTime: "2026-09-05T23:59:59",

    ticketsOnSale: true,

    currency: "BWP",

    ticketTypes: [
      { id: "general", name: "General Admission", description: "Standard seating", price: 150 },
      { id: "vip", name: "VIP", description: "Front rows + welcome drink", price: 300 },
      { id: "student", name: "Student", description: "Valid student ID required at door", price: 80 }
    ]

  }

];

/* =========================================================
SHARED HELPERS
========================================================= */

function formatShowDates(dateStrings){

  if(!dateStrings || dateStrings.length === 0) return "";

  const parsed = dateStrings.map(d => new Date(d + "T00:00:00"));

  const monthYear = parsed[0].toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const days = parsed.map(d => d.getDate());

  let dayList;

  if(days.length === 1){

    dayList = String(days[0]);

  } else {

    dayList = days.slice(0, -1).join(", ") + " & " + days[days.length - 1];

  }

  const parts = monthYear.split(" ");

  return `${parts[0]} ${dayList}, ${parts[1]}`;

}

function pickCurrentEvent(list){

  const now = new Date();

  const upcoming = list

  .filter(e => new Date(e.endDateTime) >= now)

  .sort((a, b) => new Date(a.startDateTime) - new Date(b.startDateTime));

  return upcoming.length ? upcoming[0] : null;

}

function formatMoney(amount, currency){

  return `${currency} ${amount.toFixed(2)}`;

}

/* =========================================================
TICKETS PAGE
=========================================================
Front-end ticket selector + checkout. Both Tingg and
Virtual Pay require a merchant client ID / secret / API key
that must stay on a server (never in browser JS), so the
two "Pay" buttons below call small helper functions that
POST the order to YOUR backend endpoint, which then talks
to Tingg / Virtual Pay and returns a redirect URL.

Until those backend endpoints exist, the buttons are wired
up and fully functional in the UI, but will show a friendly
"not connected yet" status instead of redirecting. Search
"PAYMENT_CONFIG" below to plug in your real endpoints once
you have Tingg / Virtual Pay merchant credentials.
========================================================= */

const PAYMENT_CONFIG = {

  tinggEndpoint: "/api/create-tingg-checkout",

  virtualPayEndpoint: "/api/create-virtualpay-checkout"

};

let ticketState = {

  event: null,

  selectedDate: null,

  selectedTypeId: null,

  quantity: 1

};

function formatPillDate(dateString){

  const d = new Date(dateString + "T00:00:00");

  return {
    weekday: d.toLocaleDateString('en-US', { weekday: 'short' }),
    dayMonth: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
  };

}

function formatFullDate(dateString){

  const d = new Date(dateString + "T00:00:00");

  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

}

function renderTickets(){

  const container = document.getElementById('ticketsContainer');

  const event = pickCurrentEvent(events.filter(e => e.ticketsOnSale));

  if(!event){

    container.innerHTML = `

      <div class="no-shows">

        <h3>No Tickets On Sale</h3>

        <p>Ticket sales will open once a performance is announced. Check the Events section on the home page or follow us on social media.</p>

      </div>

    `;

    return;

  }

  ticketState.event = event;

  if(!ticketState.selectedDate){

    ticketState.selectedDate = event.showDates[0];

  }

  if(!ticketState.selectedTypeId){

    ticketState.selectedTypeId = event.ticketTypes[0].id;

  }

  container.innerHTML = `

    <div class="ticket-page">

      <div class="ticket-event-head">

        <span class="label">${formatShowDates(event.showDates)} &middot; ${event.venue}</span>

        <h3>${event.title}</h3>

        <p>${event.subtitle}</p>

      </div>

      <div class="ticket-layout">

        <div class="ticket-panel">

          <h4>Choose Your Date</h4>

          <div id="datePillList" class="date-pill-list"></div>

          <h4>Choose Your Ticket</h4>

          <div id="ticketTypeList"></div>

          <div class="qty-stepper">

            <button type="button" id="qtyMinus" aria-label="Decrease quantity">&minus;</button>

            <span id="qtyValue">1</span>

            <button type="button" id="qtyPlus" aria-label="Increase quantity">&plus;</button>

          </div>

        </div>

        <div class="ticket-panel">

          <h4>Order Summary</h4>

          <div class="ticket-summary-row">
            <span>Date</span>
            <span id="summaryDate">-</span>
          </div>

          <div class="ticket-summary-row">
            <span id="summaryTypeName">-</span>
            <span id="summaryUnitPrice">-</span>
          </div>

          <div class="ticket-summary-row">
            <span>Quantity</span>
            <span id="summaryQty">1</span>
          </div>

          <div class="ticket-summary-row total">
            <span>Total</span>
            <span id="summaryTotal">-</span>
          </div>

          <div class="payment-methods">

            <button type="button" class="pay-btn" id="payTingg">
              <span class="pay-logo">Tingg</span> by Cellulant
            </button>

            <button type="button" class="pay-btn" id="payVirtualPay">
              <span class="pay-logo">Virtual Pay</span>
            </button>

          </div>

          <p class="form-status" id="ticketStatus" role="status" aria-live="polite"></p>

          <p class="ticket-note">
            Payments are processed securely by Tingg / Virtual Pay. You'll be redirected to complete payment and returned here once it's done.
          </p>

        </div>

      </div>

    </div>

  `;

  renderDatePills();
  renderTicketTypes();
  updateSummary();
  bindTicketEvents();

}

function renderDatePills(){

  const list = document.getElementById('datePillList');

  const event = ticketState.event;

  list.innerHTML = event.showDates.map(d => {

    const parts = formatPillDate(d);

    return `

      <button type="button" class="date-pill ${d === ticketState.selectedDate ? 'selected' : ''}" data-date="${d}">
        <span class="date-pill-weekday">${parts.weekday}</span>
        <span>${parts.dayMonth}</span>
      </button>

    `;

  }).join('');

  list.querySelectorAll('.date-pill').forEach(el => {

    el.addEventListener('click', () => {

      ticketState.selectedDate = el.getAttribute('data-date');

      renderDatePills();
      updateSummary();

    });

  });

}

function renderTicketTypes(){

  const list = document.getElementById('ticketTypeList');

  const event = ticketState.event;

  list.innerHTML = event.ticketTypes.map(t => `

    <div class="ticket-type ${t.id === ticketState.selectedTypeId ? 'selected' : ''}" data-type-id="${t.id}">

      <div class="ticket-type-info">
        <h5>${t.name}</h5>
        <span>${t.description}</span>
      </div>

      <div class="ticket-type-price">${formatMoney(t.price, event.currency)}</div>

    </div>

  `).join('');

  list.querySelectorAll('.ticket-type').forEach(el => {

    el.addEventListener('click', () => {

      ticketState.selectedTypeId = el.getAttribute('data-type-id');

      renderTicketTypes();
      updateSummary();

    });

  });

}

function getSelectedTicketType(){

  return ticketState.event.ticketTypes.find(t => t.id === ticketState.selectedTypeId);

}

function updateSummary(){

  const event = ticketState.event;
  const type = getSelectedTicketType();

  document.getElementById('summaryDate').textContent = formatFullDate(ticketState.selectedDate);
  document.getElementById('summaryTypeName').textContent = type.name;
  document.getElementById('summaryUnitPrice').textContent = formatMoney(type.price, event.currency);
  document.getElementById('summaryQty').textContent = ticketState.quantity;
  document.getElementById('qtyValue').textContent = ticketState.quantity;
  document.getElementById('summaryTotal').textContent = formatMoney(type.price * ticketState.quantity, event.currency);

}

function bindTicketEvents(){

  document.getElementById('qtyMinus').addEventListener('click', () => {

    ticketState.quantity = Math.max(1, ticketState.quantity - 1);
    updateSummary();

  });

  document.getElementById('qtyPlus').addEventListener('click', () => {

    ticketState.quantity = Math.min(10, ticketState.quantity + 1);
    updateSummary();

  });

  document.getElementById('payTingg').addEventListener('click', () => startCheckout('tingg'));
  document.getElementById('payVirtualPay').addEventListener('click', () => startCheckout('virtualpay'));

}

function buildOrderPayload(){

  const event = ticketState.event;
  const type = getSelectedTicketType();

  return {
    reference: `MDT-${Date.now()}`,
    eventTitle: event.title,
    performanceDate: formatFullDate(ticketState.selectedDate),
    ticketType: type.name,
    unitPrice: type.price,
    quantity: ticketState.quantity,
    total: type.price * ticketState.quantity,
    currency: event.currency
  };

}

async function startCheckout(provider){

  const statusEl = document.getElementById('ticketStatus');
  const payButtons = document.querySelectorAll('.pay-btn');

  const order = buildOrderPayload();

  const endpoint = provider === 'tingg' ? PAYMENT_CONFIG.tinggEndpoint : PAYMENT_CONFIG.virtualPayEndpoint;
  const providerLabel = provider === 'tingg' ? 'Tingg' : 'Virtual Pay';

  payButtons.forEach(b => b.disabled = true);

  statusEl.className = 'form-status';
  statusEl.textContent = `Connecting to ${providerLabel}\u2026`;

  try{

    const response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order)
    });

    if(!response.ok) throw new Error('checkout endpoint not available');

    const data = await response.json();

    if(!data.redirectUrl) throw new Error('no redirect url returned');

    window.location.href = data.redirectUrl;

  } catch(err){

    // This is expected until a real backend endpoint is wired
    // up with your Tingg / Virtual Pay merchant credentials.

    statusEl.className = 'form-status error';

    statusEl.textContent = `${providerLabel} checkout isn't connected yet. Please call +267 75252777 or email mophatodancetheatre@gmail.com to book your seat for ${order.performanceDate}, quoting reference ${order.reference}.`;

    payButtons.forEach(b => b.disabled = false);

  }

}

/* =========================================================
LOAD REMOTE DATA (Firestore) + BOOT THE PAGE
=========================================================
If firebase-config.js has been filled in with real project
keys, this pulls the live events added via admin.html. If
not configured yet (or briefly unreachable), the page falls
back to the array defined above so it never breaks.
========================================================= */

async function loadRemoteData(){

  if(!window.mdtFirestoreReady) return;

  try{

    const db = window.mdtDb;

    const eventsSnap = await db.collection('events').orderBy('startDateTime').get();

    if(!eventsSnap.empty){
      events = eventsSnap.docs.map(doc => doc.data());
    }

  } catch(err){

    console.warn('Mophato: using fallback content — Firestore not reachable yet.', err);

  }

}

async function initPage(){

  await loadRemoteData();

  renderTickets();

}

initPage();

</script>
