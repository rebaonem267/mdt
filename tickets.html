<style>

/* =========================================================
ROOT VARIABLES
========================================================= */

:root{

  --gold:#d4a017;
  --gold-light:#f4c542;

  --dark:#050505;
  --dark2:#0d0d0d;
  --dark3:#141414;

  --white:#ffffff;
  --gray:#c0c0c0;

}

/* =========================================================
GLOBAL RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  background:black;

  color:white;

  font-family:'Poppins',sans-serif;

  overflow-x:hidden;

}

img{
  max-width:100%;
  display:block;
}

section{
  padding:120px 8%;
  position:relative;
}

h1,h2,h3,h4{
  font-family:'Oswald',sans-serif;
}

/* =========================================================
NAVIGATION BAR
========================================================= */

nav{

  position:fixed;

  top:0;
  left:0;

  width:100%;

  padding:22px 8%;

  display:flex;

  justify-content:space-between;
  align-items:center;

  z-index:999;

  background:rgba(0,0,0,0.45);

  backdrop-filter:blur(10px);

  border-bottom:1px solid rgba(255,255,255,0.05);

}

/* =========================================================
LOGO
========================================================= */

.logo{

  display:flex;

  align-items:center;

  text-decoration:none;

}

.logo img{

  width:180px;

  max-width:100%;

  height:auto;

  object-fit:contain;

  background:transparent;

  mix-blend-mode:screen;

}

/* =========================================================
NAV LINKS
========================================================= */

nav ul{

  display:flex;

  align-items:center;

  list-style:none;

  gap:40px;

  flex-wrap:wrap;

}

nav ul li a{

  text-decoration:none;

  color:white;

  font-size:15px;

  letter-spacing:2px;

  text-transform:uppercase;

  transition:0.3s;

  position:relative;

}

nav ul li a:hover{
  color:var(--gold);
}

/* =========================================================
HAMBURGER MENU
========================================================= */

.hamburger{

  display:none;

  flex-direction:column;

  gap:5px;

  cursor:pointer;

}

.hamburger span{

  width:25px;
  height:2px;

  background:white;

}

/* =========================================================
BUTTONS
========================================================= */

.btn{

  padding:18px 40px;

  border-radius:60px;

  border:none;

  cursor:pointer;

  font-weight:600;

  transition:0.4s;

  text-decoration:none;

  font-size:15px;

}

.gold-btn{

  background:var(--gold);

  color:black;

}

.gold-btn:hover{

  background:var(--gold-light);

  transform:translateY(-4px);

}

/* =========================================================
SECTION TITLES
========================================================= */

.section-title{

  text-align:center;

  margin-bottom:70px;

}

.section-title small{

  display:block;

  color:var(--gold);

  letter-spacing:5px;

  text-transform:uppercase;

  margin-bottom:20px;

}

.section-title h2{

  font-size:clamp(2.5rem,7vw,5rem);

  line-height:1.1;

}

/* =========================================================
TICKETS PAGE HEADER
========================================================= */

.tickets-page-header{

  padding-top:180px;

  padding-bottom:0;

  text-align:center;

}

.back-link{

  display:inline-flex;

  align-items:center;

  gap:8px;

  color:var(--gray);

  text-decoration:none;

  font-size:0.9rem;

  letter-spacing:1px;

  text-transform:uppercase;

  margin-bottom:30px;

  transition:0.3s;

}

.back-link:hover{

  color:var(--gold);

}

/* =========================================================
TICKETS / NO SALE STATE
========================================================= */

#ticketsContainer{

  display:flex;

  justify-content:center;

}

.no-shows{

  text-align:center;

  padding:80px 30px;

  border:1px dashed rgba(255,255,255,0.15);

  border-radius:30px;

  width:100%;

  max-width:700px;

}

.no-shows h3{

  font-size:2.2rem;

  color:var(--gold);

  margin-bottom:18px;

  text-transform:uppercase;

  letter-spacing:3px;

}

.no-shows p{

  color:var(--gray);

  font-size:1.05rem;

}

/* =========================================================
TICKETS PAGE
========================================================= */

.ticket-page{

  width:100%;

  max-width:960px;

}

.ticket-event-head{

  text-align:center;

  margin-bottom:50px;

}

.ticket-event-head .label{

  display:block;

  color:var(--gold);

  letter-spacing:5px;

  text-transform:uppercase;

  font-size:0.8rem;

  margin-bottom:16px;

}

.ticket-event-head h3{

  font-size:clamp(1.8rem,4vw,2.6rem);

  margin-bottom:14px;

}

.ticket-event-head p{

  color:var(--gray);

  max-width:650px;

  margin:0 auto;

  line-height:1.7;

}

.ticket-layout{

  display:grid;

  grid-template-columns:1.3fr 1fr;

  gap:40px;

  align-items:start;

}

.ticket-panel{

  background:var(--dark3);

  border:1px solid rgba(212,160,23,0.25);

  border-radius:26px;

  padding:40px;

}

.ticket-panel h4{

  font-size:1.1rem;

  letter-spacing:2px;

  text-transform:uppercase;

  color:var(--gold);

  margin-bottom:24px;

}

.ticket-type{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:16px;

  flex-wrap:wrap;

  padding:22px;

  border:1px solid rgba(255,255,255,0.08);

  border-radius:18px;

  margin-bottom:16px;

  transition:0.3s;

}

.ticket-type.has-qty{

  border-color:var(--gold);

  background:rgba(212,160,23,0.08);

}

.ticket-type-info{

  flex:1 1 160px;

  min-width:0;

}

.ticket-type-info h5{

  font-size:1.1rem;

  margin-bottom:6px;

  font-family:'Oswald',sans-serif;

}

.ticket-type-info span{

  color:var(--gray);

  font-size:0.9rem;

}

.ticket-type-price{

  font-family:'Oswald',sans-serif;

  color:var(--gold);

  font-size:1.3rem;

  white-space:nowrap;

}

.date-pill-list{

  display:flex;

  flex-wrap:wrap;

  gap:12px;

  margin-bottom:12px;

}

.date-pill{

  padding:14px 20px;

  border:1px solid rgba(255,255,255,0.12);

  border-radius:14px;

  background:transparent;

  color:white;

  font-family:'Poppins',sans-serif;

  font-size:0.95rem;

  cursor:pointer;

  transition:0.3s;

  text-align:center;

}

.date-pill span{

  display:block;

}

.date-pill .date-pill-weekday{

  color:var(--gray);

  font-size:0.7rem;

  letter-spacing:1px;

  text-transform:uppercase;

  margin-bottom:4px;

}

.date-pill .date-pill-status{

  margin-top:6px;

  font-size:0.68rem;

  letter-spacing:0.4px;

  color:var(--gold);

}

.date-pill:hover:not(:disabled){

  border-color:rgba(212,160,23,0.5);

}

.date-pill.selected{

  border-color:var(--gold);

  background:rgba(212,160,23,0.1);

  color:var(--gold);

}

.date-pill.selected .date-pill-weekday{

  color:var(--gold);

}

.date-pill.soldout{

  opacity:0.45;

  cursor:not-allowed;

  text-decoration:line-through;

}

.date-pill.soldout .date-pill-status{

  color:#e07070;

  text-decoration:none;

}

#dateAvailabilityNote{

  color:#e07070;

  font-size:0.85rem;

  margin-bottom:24px;

  min-height:1em;

}

.qty-stepper{

  display:flex;

  align-items:center;

  gap:14px;

}

.qty-stepper button{

  width:38px;

  height:38px;

  border-radius:50%;

  border:1px solid rgba(212,160,23,0.5);

  background:transparent;

  color:var(--gold);

  font-size:1.1rem;

  cursor:pointer;

  transition:0.3s;

  flex-shrink:0;

}

.qty-stepper button:hover{

  background:var(--gold);

  color:black;

}

.qty-stepper span{

  min-width:26px;

  text-align:center;

  font-size:1.1rem;

  font-family:'Oswald',sans-serif;

}

.ticket-summary-row{

  display:flex;

  justify-content:space-between;

  gap:14px;

  padding:14px 0;

  border-bottom:1px solid rgba(255,255,255,0.08);

  color:var(--gray);

}

.ticket-summary-row.total{

  color:white;

  font-size:1.3rem;

  font-family:'Oswald',sans-serif;

  border-bottom:none;

  padding-top:20px;

}

.ticket-summary-row.total span:last-child{

  color:var(--gold);

}

.payment-methods{

  margin-top:30px;

  display:flex;

  flex-direction:column;

  gap:14px;

}

.pay-btn{

  width:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

  padding:18px;

  border-radius:14px;

  border:1px solid rgba(255,255,255,0.15);

  background:#1a1a1a;

  color:white;

  font-size:15px;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;

  text-align:center;

}

.pay-btn:hover:not(:disabled){

  border-color:var(--gold);

  color:var(--gold);

}

.pay-btn:disabled{

  opacity:0.45;

  cursor:not-allowed;

}

.pay-btn:disabled:hover{

  border-color:rgba(255,255,255,0.15);

  color:white;

}

.pay-btn.done{

  border-color:var(--gold);

  color:var(--gold);

  opacity:0.7;

}

.pay-btn .pay-logo{

  font-family:'Oswald',sans-serif;

  font-weight:700;

  letter-spacing:0.5px;

}

.form-status{

  min-height:22px;

  margin-top:16px;

  font-size:0.9rem;

}

.form-status.success{
  color:var(--gold);
}

.form-status.error{
  color:#e07070;
}

.ticket-note{

  margin-top:18px;

  color:var(--gray);

  font-size:0.82rem;

  line-height:1.6;

  text-align:center;

}

/* =========================================================
FOOTER
========================================================= */

footer{

  display:flex;

  justify-content:space-between;

.footer-logo{

.footer-text h4{

}

.footer-text p{

  color:var(--gray);

  font-size:0.85rem;

  letter-spacing:0.3px;

}

.footer-social{

  display:flex;

}

.social-links a{

  text-decoration:none;

}

.social-links a:hover{
  color:var(--gold);

.social-icon{

  width:44px;

  border-radius:50%;

  border:1px solid rgba(212,160,23,0.35);

  align-items:center;

  justify-content:center;

  color:var(--gold);

  transition:0.3s;

  flex-shrink:0;

}

.social-icon svg{

  width:18px;

  height:18px;

}

.social-icon:hover{

  background:var(--gold);

  color:black;

  border-color:var(--gold);

/* =========================================================
TABLET RESPONSIVE

@media(max-width:950px){

    position:fixed;

    height:100vh;

    flex-direction:column;

    justify-content:center;

    background:rgba(0,0,0,0.97);

    padding:40px 6%;

    transition:0.4s;

  }

  nav ul.active{

========================================================= */

@media(max-width:768px){

  }

  footer{

    justify-content:center;

    text-align:center;

    flex-direction:column;

  }

  .footer-brand{

    flex-direction:column;

  }

}

<script>

/* =========================================================
LEMON SQUEEZY CONFIGURATION
=========================================================
Only your store ID lives here now. Each individual ticket
type (Single Seat, Double Seat, VIP, etc.) carries its own
Lemon Squeezy Variant ID, set per ticket type in the Admin
page — so you can add or remove ticket types freely without
ever touching this file again.

Find your store ID in Lemon Squeezy under Settings > Stores.
========================================================= */

const LEMON_SQUEEZY_CONFIG = {

  storeId: "YOUR_STORE_ID"

};

/* =========================================================
UPCOMING EVENTS DATA
=========================================================
This is the same array that lives in index.html. If you
add/change a show, update it in BOTH files.

showDates entries: { date: "YYYY-MM-DD", status: "" }
`status` is optional free text shown as a badge on a date's
pill below — e.g. "Sold Out" or "20 Tickets Left". Text
containing "sold out" automatically disables that date here
on the tickets page.

ticketTypes entries now include `variantId`, the Lemon
Squeezy variant ID for that specific ticket product. Fill
these in via the Admin page.
========================================================= */

let events = [

  {

    title: "CHABA",

    subtitle: "Mophato Dance Theatre's 15th Anniversary Celebration & the launch of Mophato's book, \u201cBotswana's Story, Told in Dance.\u201d",

    venue: "Civic Center (Gaborone City Council), Main Mall",

    showTime: "19:30",

    showDates: [
      { date: "2026-09-01", status: "" },
      { date: "2026-09-02", status: "" },
      { date: "2026-09-03", status: "" },
      { date: "2026-09-05", status: "" }
    ],

    startDateTime: "2026-09-01T19:30:00",

    endDateTime: "2026-09-05T23:59:59",

    ticketsOnSale: true,

    currency: "BWP",

    ticketTypes: [
      { id: "single", name: "Single Seat", description: "One seat", price: 250, variantId: "YOUR_SINGLE_SEAT_VARIANT_ID" },
      { id: "double", name: "Double Seat", description: "Two seats", price: 450, variantId: "YOUR_DOUBLE_SEAT_VARIANT_ID" }
    ]

  }

];

/* =========================================================
SHARED HELPERS
========================================================= */

function formatShowDates(dateEntries){

  if(!dateEntries || dateEntries.length === 0) return "";

  const parsed = dateEntries.map(d => new Date(d.date + "T00:00:00"));

  const monthYear = parsed[0].toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const days = parsed.map(d => d.getDate());

  let dayList;

  if(days.length === 1){

    dayList = String(days[0]);

  } else {

    dayList = days.slice(0, -1).join(", ") + " & " + days[days.length - 1];

  }

  const parts = monthYear.split(" ");

  return `${parts[0]} ${dayList}, ${parts[1]}`;

}

function pickCurrentEvent(list){

  const now = new Date();

  const upcoming = list

  .filter(e => new Date(e.endDateTime) >= now)

  .sort((a, b) => new Date(a.startDateTime) - new Date(b.startDateTime));

  return upcoming.length ? upcoming[0] : null;

}

function formatMoney(amount, currency){

  return `${currency} ${amount.toFixed(2)}`;

}

function escapeHtml(str){
  return String(str || '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}

function isSoldOut(dateEntry){
  return !!(dateEntry && dateEntry.status && /sold\s*out/i.test(dateEntry.status));
}

/* =========================================================
TICKETS PAGE STATE
=========================================================
`quantities` is a map of ticketType.id -> quantity, so more
than one ticket type can be selected and purchased together
(e.g. 2 Single Seats AND 1 Double Seat in the same order).
========================================================= */

let ticketState = {

  event: null,

  selectedDate: null,

  quantities: {}

};

let checkoutQueue = [];
let checkoutQueueDone = [];

function formatPillDate(dateString){

  const d = new Date(dateString + "T00:00:00");

  return {
    weekday: d.toLocaleDateString('en-US', { weekday: 'short' }),
    dayMonth: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
  };

}

function formatFullDate(dateString){

  const d = new Date(dateString + "T00:00:00");

  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

}

function renderTickets(){

  const container = document.getElementById('ticketsContainer');

  const event = pickCurrentEvent(events.filter(e => e.ticketsOnSale));

  if(!event){

    container.innerHTML = `

      <div class="no-shows">

        <h3>No Tickets On Sale</h3>

        <p>Ticket sales will open once a performance is announced. Check the Events section on the home page or follow us on social media.</p>

      </div>

    `;

    return;

  }

  ticketState.event = event;

  if(!ticketState.selectedDate){

    const firstAvailable = event.showDates.find(d => !isSoldOut(d));

    ticketState.selectedDate = (firstAvailable || event.showDates[0]).date;

  }

  container.innerHTML = `

    <div class="ticket-page">

      <div class="ticket-event-head">

        <span class="label">${formatShowDates(event.showDates)} at ${event.showTime} &middot; ${event.venue}</span>

        <h3>${event.title}</h3>

        <p>${event.subtitle}</p>

      </div>

      <div class="ticket-layout">

        <div class="ticket-panel">

          <h4>Choose Your Date</h4>

          <div id="datePillList" class="date-pill-list"></div>

          <p id="dateAvailabilityNote"></p>

          <h4>Choose Your Tickets</h4>

          <p class="hint" style="color:var(--gray); font-size:0.85rem; margin:-14px 0 20px;">
            You can select more than one ticket type &mdash; e.g. Single Seats and Double Seats together.
          </p>

          <div id="ticketTypeList"></div>

        </div>

        <div class="ticket-panel">

          <h4>Order Summary</h4>

          <div class="ticket-summary-row">
            <span>Date</span>
            <span id="summaryDate">-</span>
          </div>

          <div id="summaryLines"></div>

          <div class="ticket-summary-row total">
            <span>Total</span>
            <span id="summaryTotal">-</span>
          </div>

          <div class="payment-methods">

            <div id="payLemonSqueezyWrap">
              <button type="button" class="pay-btn" id="payLemonSqueezyBtn">
                <span class="pay-logo">Pay with Lemon Squeezy</span>
              </button>
            </div>

          </div>

          <p class="form-status" id="ticketStatus" role="status" aria-live="polite"></p>

          <p class="ticket-note">
            Payments are processed securely by Lemon Squeezy. You'll be redirected to complete payment.
          </p>

        </div>

      </div>

    </div>

  `;

  checkoutQueue = [];
  checkoutQueueDone = [];

  renderDatePills();
  renderTicketTypes();
  updateSummary();
  bindTicketEvents();

}

function renderDatePills(){

  const list = document.getElementById('datePillList');
  const noteEl = document.getElementById('dateAvailabilityNote');

  const event = ticketState.event;

  list.innerHTML = event.showDates.map(d => {

    const parts = formatPillDate(d.date);
    const soldOut = isSoldOut(d);
    const hasStatus = d.status && d.status.trim() !== '';

    return `

      <button type="button"
        class="date-pill ${d.date === ticketState.selectedDate ? 'selected' : ''} ${soldOut ? 'soldout' : ''}"
        data-date="${d.date}"
        ${soldOut ? 'disabled' : ''}>
        <span class="date-pill-weekday">${parts.weekday}</span>
        <span>${parts.dayMonth}</span>
        ${hasStatus ? `<span class="date-pill-status">${escapeHtml(d.status)}</span>` : ''}
      </button>

    `;

  }).join('');

  list.querySelectorAll('.date-pill:not(.soldout)').forEach(el => {

    el.addEventListener('click', () => {

      ticketState.selectedDate = el.getAttribute('data-date');

      renderDatePills();
      updateSummary();

    });

  });

  const selectedInfo = event.showDates.find(d => d.date === ticketState.selectedDate);

  if(isSoldOut(selectedInfo)){
    noteEl.textContent = 'This date is sold out — please choose another date above.';
  } else {
    noteEl.textContent = '';
  }

}

function renderTicketTypes(){

  const list = document.getElementById('ticketTypeList');

  const event = ticketState.event;

  list.innerHTML = event.ticketTypes.map(t => {

    const qty = ticketState.quantities[t.id] || 0;

    return `

      <div class="ticket-type ${qty > 0 ? 'has-qty' : ''}" data-type-id="${t.id}">

        <div class="ticket-type-info">
          <h5>${t.name}</h5>
          <span>${t.description}</span>
        </div>

        <div class="ticket-type-price">${formatMoney(t.price, event.currency)}</div>

        <div class="qty-stepper" data-type-id="${t.id}">
          <button type="button" class="qty-minus" aria-label="Decrease ${escapeHtml(t.name)} quantity">&minus;</button>
          <span class="qty-display">${qty}</span>
          <button type="button" class="qty-plus" aria-label="Increase ${escapeHtml(t.name)} quantity">&plus;</button>
        </div>

      </div>

    `;

  }).join('');

  list.querySelectorAll('.ticket-type').forEach(row => {

    const typeId = row.getAttribute('data-type-id');

    row.querySelector('.qty-minus').addEventListener('click', () => changeQty(typeId, -1));
    row.querySelector('.qty-plus').addEventListener('click', () => changeQty(typeId, 1));

  });

}

function changeQty(typeId, delta){

  const current = ticketState.quantities[typeId] || 0;

  const next = Math.max(0, Math.min(10, current + delta));

  ticketState.quantities[typeId] = next;

  renderTicketTypes();
  updateSummary();

}

function getSelectedLines(){

  const event = ticketState.event;

  return event.ticketTypes
    .map(t => ({ type: t, qty: ticketState.quantities[t.id] || 0 }))
    .filter(l => l.qty > 0);

}

function updateSummary(){

  const event = ticketState.event;

  document.getElementById('summaryDate').textContent = formatFullDate(ticketState.selectedDate);

  const lines = getSelectedLines();

  const linesEl = document.getElementById('summaryLines');

  if(lines.length === 0){

    linesEl.innerHTML = `<div class="ticket-summary-row"><span>No tickets selected</span><span>-</span></div>`;

  } else {

    linesEl.innerHTML = lines.map(l => `
      <div class="ticket-summary-row">
        <span>${escapeHtml(l.type.name)} &times; ${l.qty}</span>
        <span>${formatMoney(l.type.price * l.qty, event.currency)}</span>
      </div>
    `).join('');

  }

  const total = lines.reduce((sum, l) => sum + l.type.price * l.qty, 0);

  document.getElementById('summaryTotal').textContent = formatMoney(total, event.currency);

  const selectedDateInfo = event.showDates.find(d => d.date === ticketState.selectedDate);
  const soldOut = isSoldOut(selectedDateInfo);

  const payBtn = document.getElementById('payLemonSqueezyBtn');

  if(payBtn){
    payBtn.disabled = lines.length === 0 || soldOut;
  }

}

function bindTicketEvents(){

  document.getElementById('payLemonSqueezyBtn').addEventListener('click', startLemonSqueezyCheckout);

}

/* =========================================================
LEMON SQUEEZY CHECKOUT
=========================================================
Builds a Lemon Squeezy hosted checkout link for one ticket
type + quantity, carrying the performance details as custom
data (visible to you in the Lemon Squeezy order/webhook data).

IMPORTANT LIMITATION: Lemon Squeezy's hosted checkout link
only supports ONE product (variant) per checkout. There is no
official multi-item "cart" for simple links like this (a true
combined cart needs Lemon Squeezy's API from a server, which
this static site doesn't have).

So, when someone picks more than one ticket type (e.g. Single
Seats AND Double Seats), we open one secure Lemon Squeezy
checkout tab per ticket type, one after another, so they can
complete each purchase in turn without losing their place on
this page.
========================================================= */

function buildCheckoutUrl(type, qty){

  const event = ticketState.event;

  const params = new URLSearchParams();

  params.set('quantity', qty);
  params.set('checkout[custom][ticket_type]', type.name);
  params.set('checkout[custom][performance_date]', formatFullDate(ticketState.selectedDate));
  params.set('checkout[custom][show_time]', event.showTime || '');
  params.set('checkout[custom][venue]', event.venue || '');

  return `https://${LEMON_SQUEEZY_CONFIG.storeId}.lemonsqueezy.com/checkout/buy/${type.variantId}?${params.toString()}`;

}

function startLemonSqueezyCheckout(){

  const statusEl = document.getElementById('ticketStatus');

  const lines = getSelectedLines();

  if(lines.length === 0){

    statusEl.className = 'form-status error';
    statusEl.textContent = 'Please select at least one ticket.';
    return;

  }

  const badConfig = !LEMON_SQUEEZY_CONFIG.storeId
    || LEMON_SQUEEZY_CONFIG.storeId === 'YOUR_STORE_ID'
    || lines.some(l => !l.type.variantId || l.type.variantId.trim() === '' || /^YOUR_/.test(l.type.variantId));

  if(badConfig){

    statusEl.className = 'form-status error';
    statusEl.textContent = 'Lemon Squeezy isn\u2019t fully configured for one of these ticket types yet. Please contact us directly to book.';
    return;

  }

  checkoutQueue = lines;
  checkoutQueueDone = [];

  if(checkoutQueue.length === 1){

    statusEl.className = 'form-status';
    statusEl.textContent = 'Connecting to Lemon Squeezy\u2026';

    window.location.href = buildCheckoutUrl(checkoutQueue[0].type, checkoutQueue[0].qty);
    return;

  }

  renderCheckoutQueue();

}

function renderCheckoutQueue(){

  const wrap = document.getElementById('payLemonSqueezyWrap');
  const statusEl = document.getElementById('ticketStatus');

  statusEl.className = 'form-status';
  statusEl.textContent = 'You picked more than one ticket type, so we\u2019ll open one secure checkout per type below \u2014 complete each to finish your order (any order, either tab).';

  wrap.innerHTML = checkoutQueue.map((item, i) => {

    const done = checkoutQueueDone.includes(i);

    return `
      <button type="button" class="pay-btn ${done ? 'done' : ''}" data-idx="${i}">
        <span class="pay-logo">${done ? '\u2713 Paid for ' : 'Pay for '}${escapeHtml(item.type.name)} (&times;${item.qty}) \u2014 Lemon Squeezy</span>
      </button>
    `;

  }).join('');

  wrap.querySelectorAll('button[data-idx]').forEach(btn => {

    btn.addEventListener('click', () => {

      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const item = checkoutQueue[idx];

      window.open(buildCheckoutUrl(item.type, item.qty), '_blank', 'noopener');

      if(!checkoutQueueDone.includes(idx)) checkoutQueueDone.push(idx);

      renderCheckoutQueue();

      if(checkoutQueueDone.length === checkoutQueue.length){

        statusEl.className = 'form-status success';
        statusEl.textContent = 'All checkouts opened \u2014 complete payment in each tab to confirm your booking.';

      }

    });

  });

}

/* =========================================================
LOAD REMOTE DATA (Firestore) + BOOT THE PAGE
========================================================= */

async function loadRemoteData(){

  if(!window.mdtFirestoreReady) return;

  try{

    const db = window.mdtDb;

    const eventsSnap = await db.collection('events').orderBy('startDateTime').get();

    if(!eventsSnap.empty){
      events = eventsSnap.docs.map(doc => doc.data());
    }

  } catch(err){

    console.warn('Mophato: using fallback content — Firestore not reachable yet.', err);

  }

}

async function initPage(){

  await loadRemoteData();

  renderTickets();

}

initPage();
